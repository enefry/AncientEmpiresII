name: AncientEmpiresII
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  AncientEmpiresEngine:
    path: Packages/AncientEmpiresEngine
targets:
  AncientEmpiresII:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: AncientEmpiresEngine
        product: AECore
      - package: AncientEmpiresEngine
        product: AEContent
    info:
      path: App/Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans, zh-Hant]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: win.tools4me.AncientEmpires
        PRODUCT_NAME: Ancient Empires II
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 34PEP7YC95
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AEAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: AncientEmpiresII
      - package: AncientEmpiresEngine
        product: AECore
      - package: AncientEmpiresEngine
        product: AEContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenrenwei.AncientEmpiresII.UITests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AncientEmpiresII
        CODE_SIGN_STYLE: Automatic
  AEAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: AncientEmpiresII
      - package: AncientEmpiresEngine
        product: AECore
      - package: AncientEmpiresEngine
        product: AEContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenrenwei.AncientEmpiresII.Tests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ancient Empires II.app/Ancient Empires II"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  AncientEmpiresII:
    build:
      targets:
        AncientEmpiresII: all
        AEAppUITests: [test]
        AEAppTests: [test]
    test:
      targets:
        - AEAppTests
        - AEAppUITests
